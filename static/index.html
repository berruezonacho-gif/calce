<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <title>Calce — Tesorería PyME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M30 9 A14 14 0 0 0 20 5 A14 14 0 0 0 6 19 L13 19 A7 7 0 0 1 20 12 A7 7 0 0 1 25 14 Z" fill="#2DD4BF"/>
        <path d="M30 31 A14 14 0 0 1 20 35 A14 14 0 0 1 6 21 L13 21 A7 7 0 0 0 20 28 A7 7 0 0 0 25 26 Z" fill="#4C8DFF"/>
      </svg>
      <span class="brand-name">Calce</span>
    </div>
    <nav class="topnav">
      <button class="nav-item active" data-view="flujo">Flujo de caja</button>
      <div class="nav-dropdown">
        <button class="nav-item nav-drop-btn" data-group="inversiones">Inversiones <span class="caret">▾</span></button>
        <div class="nav-menu">
          <button class="nav-sub" data-view="inversiones">Simulador</button>
          <button class="nav-sub" data-view="excedente">Excedente</button>
          <button class="nav-sub" data-view="divisas">Dólar (comprar/vender)</button>
          <button class="nav-sub" data-view="fci">FCI</button>
          <button class="nav-sub" data-view="mercado">Bonos</button>
        </div>
      </div>
      <button class="nav-item" data-view="impuestos">Impuestos</button>
      <button class="nav-item" data-view="conciliacion">Conciliación</button>
      <button class="nav-item nav-config" data-view="config" title="Configuración">⚙ Configuración</button>
    </nav>
  </header>

  <main class="main" id="main">
    <!-- Vista Flujo de caja -->
    <section class="view" id="view-flujo">

      <div class="board">
        <!-- Panel de control izquierdo -->
        <aside class="controls">
          <div class="ctrl-card">
            <div class="ctrl-head">
              <h2>Cuentas</h2>
            </div>
            <div class="accounts-list" id="accounts-list"></div>
            <div class="accounts-total" id="accounts-total"></div>
            <label class="field" style="margin-top:14px">
              <span>Colchón mínimo</span>
              <div class="money-input">
                <em>$</em>
                <input type="number" id="buffer" value="200000" step="1000">
              </div>
              <small>La plata que no querés tocar nunca.</small>
            </label>
            <label class="field">
              <span>Horizonte</span>
              <select id="horizon">
                <option value="30">30 días</option>
                <option value="60">60 días</option>
                <option value="90" selected>90 días</option>
                <option value="180">6 meses</option>
                <option value="365">1 año</option>
              </select>
            </label>
          </div>

          <div class="ctrl-card">
            <div class="ctrl-head">
              <h2>Movimientos</h2>
              <div class="ctrl-actions">
                <button class="add-btn ghost" id="import-mov">↑ Importar</button>
                <button class="add-btn" id="add-mov">+ Agregar</button>
              </div>
            </div>
            <input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="display:none">
            <div class="mov-summary" id="mov-summary"></div>
          </div>
        </aside>

        <!-- Resultado principal -->
        <div class="result">
          <div class="kpi-row" id="kpi-row"></div>
          <div class="currency-tabs" id="currency-tabs"></div>
          <div class="account-balances" id="account-balances"></div>
          <div class="table-card">
            <div class="chart-head">
              <h2>Detalle por fecha</h2>
              <div class="chart-tools">
                <select id="cf-account-filter" class="cf-account-filter">
                  <option value="">Todas las cuentas</option>
                </select>
                <div class="view-toggle">
                  <button class="vt-btn active" data-cfgrain="dia">Por día</button>
                  <button class="vt-btn" data-cfgrain="semana">Por semana</button>
                </div>
                <button class="cf-link" id="cf-export">↓ CSV</button>
              </div>
            </div>
            <div id="cf-table"></div>
          </div>
          <div class="chart-card">
            <div class="chart-head">
              <h2>Saldo proyectado</h2>
              <div class="chart-legend">
                <span class="lg lg-balance">Saldo</span>
                <span class="lg lg-buffer">Colchón</span>
                <span class="lg lg-surplus">Excedente</span>
              </div>
            </div>
            <div id="chart"></div>
          </div>
          <div class="insights" id="insights"></div>
        </div>
      </div>
    </section>

    <!-- Vista Excedente -->
    <section class="view hidden" id="view-excedente">
      <div class="excedente-wrap" id="excedente-wrap"></div>
    </section>

    <!-- Vista Inversiones -->
    <section class="view hidden" id="view-inversiones">
      <div class="inv-wrap" id="inv-wrap"></div>
    </section>

    <!-- Vista Dólar: comprar / vender divisas -->
    <section class="view hidden" id="view-divisas">
      <div class="divisas-wrap" id="divisas-wrap"></div>
    </section>

    <!-- Vista Mercado de bonos (tableros con métricas y curvas) -->
    <section class="view hidden" id="view-mercado">
      <div class="mkt-wrap" id="mkt-wrap"></div>
    </section>

    <!-- Vista FCI con filtros -->
    <section class="view hidden" id="view-fci">
      <div class="fci-wrap" id="fci-wrap"></div>
    </section>

    <!-- Vista Impuestos -->
    <section class="view hidden" id="view-impuestos">
      <div class="imp-wrap" id="imp-wrap"></div>
    </section>

    <!-- Vista Conciliación bancaria -->
    <section class="view hidden" id="view-conciliacion">
      <div class="conc-wrap" id="conc-wrap"></div>
    </section>

    <!-- Vista Configuración -->
    <section class="view hidden" id="view-config">
      <div class="config-wrap" id="config-wrap"></div>
    </section>
  </main>

  <!-- Template de fila de movimiento -->
  <template id="mov-template">
    <div class="mov-row">
      <input class="mov-label" type="text" placeholder="Concepto">
      <div class="mov-amount">
        <select class="mov-sign">
          <option value="1">Entra</option>
          <option value="-1">Sale</option>
        </select>
        <input class="mov-value" type="number" placeholder="0" step="1000">
      </div>
      <input class="mov-date" type="date">
      <div class="mov-meta">
        <select class="mov-rec">
          <option value="none">Una vez</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensual</option>
        </select>
        <select class="mov-medio">
          <option value="transferencia">Transferencia</option>
          <option value="efectivo">Efectivo</option>
          <option value="cheque">Cheque</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
      </div>
      <button class="mov-del" title="Eliminar">×</button>
    </div>
  </template>

  <!-- Modal para agregar/editar movimiento -->
  <div class="modal-overlay hidden" id="mov-modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="mov-modal-title">Nuevo movimiento</h2>
        <button class="modal-close" id="mov-modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="mov-mode-tabs">
          <button class="mov-mode active" data-mode="simple">Simple</button>
          <button class="mov-mode" data-mode="cheque">Cheque</button>
          <button class="mov-mode" data-mode="cuotas">En cuotas</button>
        </div>

        <label class="field"><span>Concepto</span>
          <input type="text" id="m-label" placeholder="Ej: Cobranza cliente">
        </label>
        <div class="modal-row">
          <label class="field"><span>Tipo</span>
            <select id="m-sign">
              <option value="1">Entra (ingreso)</option>
              <option value="-1">Sale (gasto)</option>
            </select>
          </label>
          <label class="field"><span id="m-value-label">Monto</span>
            <div class="money-input"><em id="m-cur">$</em><input type="number" id="m-value" placeholder="0" step="1000"></div>
          </label>
        </div>

        <!-- Fila fecha + repetición (modo simple) -->
        <div class="modal-row" id="m-simple-row">
          <label class="field"><span>Fecha</span>
            <input type="date" id="m-date">
          </label>
          <label class="field"><span>Repetición</span>
            <select id="m-rec">
              <option value="none">Una vez</option>
              <option value="weekly">Semanal</option>
              <option value="quincenal">Quincenal</option>
              <option value="monthly">Mensual</option>
              <option value="quarterly">Trimestral</option>
            </select>
          </label>
        </div>

        <!-- Cheque: fecha de emisión + vencimiento -->
        <div id="m-cheque-block" style="display:none">
          <div class="modal-row">
            <label class="field"><span>Fecha de emisión</span>
              <input type="date" id="m-emision">
            </label>
            <label class="field"><span>Fecha de vencimiento (cobro/pago)</span>
              <input type="date" id="m-venc">
            </label>
          </div>
          <p class="modal-note">El cheque impacta la caja en la fecha de vencimiento.</p>
        </div>

        <!-- Cuotas: lista de fechas + montos -->
        <div id="m-cuotas-block" style="display:none">
          <div class="cuotas-head">
            <span>Cuotas</span>
            <button type="button" class="cf-link" id="m-add-cuota">+ Agregar cuota</button>
          </div>
          <div id="m-cuotas-list"></div>
          <p class="modal-note" id="m-cuotas-total"></p>
        </div>

        <label class="field"><span>Medio de cobro / pago</span>
          <select id="m-medio">
            <option value="transferencia">Transferencia</option>
            <option value="efectivo">Efectivo</option>
            <option value="cheque">Cheque</option>
            <option value="tarjeta">Tarjeta</option>
          </select>
        </label>
        <label class="field"><span>Cuenta</span>
          <select id="m-account"></select>
        </label>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="mov-modal-cancel">Cancelar</button>
        <button class="btn-primary" id="mov-modal-save">Agregar</button>
      </div>
    </div>
  </div>

  <div class="save-indicator" id="save-indicator">✓ Guardado</div>

  <script src="/static/bancos.js?v=1"></script>
  <script src="/static/demo_constructora.js?v=1"></script>
  <script src="/static/app.js?v=1"></script>
</body>
</html>
